name: Mirror 4shared to GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "g630-u10-firmware"
      url:
        description: "4shared page URL"
        required: true
        default: "https://www.4shared.com/rar/hXt8aIoAca/Huawei_G630-U10_Unbrick-Rebair.html?sop=true"

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Download from 4shared
        env:
          URL: ${{ inputs.url }}
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ["URL"]
          out = "Huawei_G630-U10_Unbrick-Repair.rar"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(accept_downloads=True)
              page = context.new_page()

              page.goto(url, wait_until="domcontentloaded", timeout=120000)

              # اگر 4shared لاگین/کپچا خواست اینجا باید کوکی یا لاگین اضافه شود
              # page.wait_for_timeout(25000)

              with page.expect_download(timeout=300000) as dl_info:
                  # selector را در صورت نیاز با Inspect اصلاح کن
                  page.get_by_text("Download", exact=False).first.click()

              download = dl_info.value
              download.save_as(out)

              print("Downloaded:", out, os.path.getsize(out), "bytes")
              browser.close()
          PY

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --notes "Firmware mirror"

          gh release upload "$TAG" Huawei_G630-U10_Unbrick-Repair.rar \
            --clobber --repo "$GITHUB_REPOSITORY"
